spring.application.name=backend

# MySQL : les valeurs peuvent venir des variables DB_URL, DB_USERNAME et DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dulceshop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Front React / Vite
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.swagger.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never